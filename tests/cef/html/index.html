<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color the rectangle</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="main">
        <h1>Color the rectangle</h1>

        <div id="the-rectangle" style="margin-top:50px;">
            <div>This is the rectangle</div>
        </div>

        <div id="color-buttons" style="margin-top:40px;">
            <button id="btn-color-red" type="button">
                Make it <span style="color:#FF383C;">red</span>
            </button>
            <button id="btn-color-blue" type="button">
                Make it <span style="color:#0088FF;">blue</span>
            </button>
        </div>

        <div style="margin-top:30px;">
            <button id="btn-print-stdout" type="button">
                Print the current color<br>to <code>stdout</code>
            </button>
            <span id="cpp-answer">No answer so far</span>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
